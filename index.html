<main>
<header><p>1.º ASIR · Fundamentos de Hardware · RA1</p><h1>Test de Hardware</h1><p>Elige una respuesta por pregunta. Cada acierto suma un punto.</p></header>
<section aria-label="Configurar el test">
<form id="setup">
<label>Tema<select id="topicFilter"><option value="">Todos los temas</option></select></label>
<label>Preguntas<select id="size"><option value="all">Todas</option><option>20</option><option>10</option></select></label>
<button>Empezar nueva ronda</button>
</form>
</section>
<section aria-label="Test">

<div id="choices"></div>
<p id="feedback" role="status" tabindex="-1"></p>
<button id="next" hidden>Siguiente pregunta</button>
<button id="retry" hidden>Repetir las falladas</button>
</section>
<noscript>Activa JavaScript para realizar el test.</noscript>

const ui = Object.fromEntries([...document.querySelectorAll('[id]')].map(el => [el.id, el]));
for (const topic of new Set(bank.map(card => card[0]))) ui.topicFilter.add(new Option(topic, topic));

function shuffle(values) {
  const result = [...values];
  for (let index = result.length - 1; index > 0; index--) {
    const swap = Math.floor(Math.random() * (index + 1));
    [result[index], result[swap]] = [result[swap], result[index]];
  }
  return result;
}

let round, position, missed;
function start(cards, limit = cards.length, focus = true) {
  const chosen = shuffle(cards).slice(0, limit);
  const slots = shuffle(Array.from({length:4}, (_, index) => index));
  const positions = shuffle(chosen.map((_, index) => slots[index % 4]));
  round = chosen.map(([topic, question, correct, ...wrong], index) => {
    const alternatives = shuffle(wrong);
    alternatives.splice(positions[index], 0, correct);
    return {card: chosen[index], topic, question, alternatives, correct: positions[index]};
  });
  position = 0;
  missed = [];
  render(focus);
}
function render(focus = true) {
  const item = round[position];
  ui.progress.max = round.length;
  ui.progress.value = position;
  ui.status.textContent = item ? `Pregunta ${position + 1} de ${round.length}` : 'Test finalizado';
  ui.topic.textContent = item?.topic ?? '';
  ui.question.textContent = item?.question ?? `${round.length - missed.length} aciertos de ${round.length}`;
  ui.choices.replaceChildren();
  ui.feedback.textContent = item ? '' : `Nota: ${((round.length - missed.length) * 10 / round.length).toLocaleString('es-ES', {maximumFractionDigits: 2})} / 10. Fallos: ${missed.length}.`;
  ui.next.hidden = true;
  ui.retry.hidden = Boolean(item) || !missed.length;
  if (item) {
    item.alternatives.forEach((answer, index) => {
      const button = document.createElement('button');
      button.textContent = `${'ABCD'[index]}. ${answer}`;
      button.onclick = () => grade(item, index);
      ui.choices.append(button);
    });
  }
  if (focus) ui.question.focus();
}
function grade(item, selected) {
  const buttons = [...ui.choices.children];
  for (const button of buttons) button.disabled = true;
  buttons[item.correct].classList.add('correct');
  const correct = selected === item.correct;
  if (!correct) {
    buttons[selected].classList.add('wrong');
    missed.push(item.card);
  }
  ui.feedback.textContent = correct ? 'Correcto.' : `Incorrecto. Respuesta correcta: ${buttons[item.correct].textContent}`;
  ui.progress.value = position + 1;
  ui.next.textContent = position + 1 === round.length ? 'Ver resultado' : 'Siguiente pregunta';
  ui.next.hidden = false;
  ui.feedback.focus();
}
ui.next.onclick = () => { position++; render(); };
ui.retry.onclick = () => start(missed);
ui.setup.onsubmit = event => {
  event.preventDefault();
  const cards = bank.filter(card => !ui.topicFilter.value || card[0] === ui.topicFilter.value);
  start(cards, ui.size.value === 'all' ? cards.length : Number(ui.size.value));
};
start(bank, bank.length, false);
